name: medias-revolution
on: { push: { branches: [medias-revolution-360] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: echo skip || for i in 1 2 3; do sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && break; sleep 30; done
      - run: python3 outils_tmp/check_eng6.py
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan medias-revolution-360-out17 && git rm -rq --cached . && git add medias && git commit -qm "médias" && git push -f origin medias-revolution-360-out17
